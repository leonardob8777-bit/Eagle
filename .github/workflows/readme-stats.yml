name: README stats

on:
  schedule:
    - cron: '17 */3 * * *'
  release:
    types: [published]
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EAGLE_REPO: ${{ github.repository }}
        run: python3 scripts/update_readme_stats.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/badges
          git commit -m "docs: refresh README stats"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
